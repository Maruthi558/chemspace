<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#050811" stroke="url(#grad1)" stroke-width="2" />
  <!-- Orbit 1 -->
  <ellipse cx="32" cy="32" rx="22" ry="8" stroke="#06b6d4" stroke-width="1.8" stroke-dasharray="3 1.5" transform="rotate(30 32 32)" opacity="0.85" />
  <!-- Orbit 2 -->
  <ellipse cx="32" cy="32" rx="22" ry="8" stroke="#8b5cf6" stroke-width="1.8" stroke-dasharray="3 1.5" transform="rotate(-30 32 32)" opacity="0.85" />
  <!-- Orbit 3 -->
  <ellipse cx="32" cy="32" rx="22" ry="8" stroke="#10b981" stroke-width="1.8" stroke-dasharray="3 1.5" transform="rotate(90 32 32)" opacity="0.85" />
  <!-- Center Nucleus with glow -->
  <circle cx="32" cy="32" r="6" fill="url(#grad1)" filter="url(#glow)" />
  <circle cx="32" cy="32" r="3" fill="#ffffff" />
  <!-- Electron nodes -->
  <circle cx="48" cy="22" r="2.2" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="16" cy="42" r="2.2" fill="#8b5cf6" filter="url(#glow)" />
  <circle cx="32" cy="10" r="2.2" fill="#10b981" filter="url(#glow)" />
</svg>