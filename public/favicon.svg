<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- ChemSpace Precision Scientific Atom Favicon -->
  <rect width="64" height="64" rx="16" fill="#0f141c" />
  
  <!-- Outer Hexagonal Geometry -->
  <polygon points="32,8 52,19.5 52,44.5 32,56 12,44.5 12,19.5" stroke="#334155" stroke-width="2" stroke-opacity="0.8" fill="none" />
  
  <!-- Orbital Rings -->
  <ellipse cx="32" cy="32" rx="20" ry="7.5" stroke="#10b981" stroke-width="2" transform="rotate(-30 32 32)" stroke-opacity="0.9" />
  <ellipse cx="32" cy="32" rx="20" ry="7.5" stroke="#94a3b8" stroke-width="1.8" transform="rotate(30 32 32)" stroke-opacity="0.85" />
  <ellipse cx="32" cy="32" rx="20" ry="7.5" stroke="#10b981" stroke-width="1.8" transform="rotate(90 32 32)" stroke-opacity="0.85" />
  
  <!-- Central Nucleus -->
  <circle cx="32" cy="32" r="5" fill="#10b981" />
  <circle cx="32" cy="32" r="2.2" fill="#ffffff" />
  
  <!-- Electron nodes on orbital paths -->
  <circle cx="46" cy="24" r="2.5" fill="#ffffff" stroke="#10b981" stroke-width="1.2" />
  <circle cx="18" cy="40" r="2.5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />
  <circle cx="32" cy="12" r="2.5" fill="#ffffff" stroke="#10b981" stroke-width="1.2" />
</svg>