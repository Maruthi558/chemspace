<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- ChemSpace Precision Scientific Tab Favicon -->
  <rect width="64" height="64" rx="16" fill="#0c0f17" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#334155" stroke-width="2" stroke-opacity="0.6" />

  <!-- High-Contrast Hexagonal Molecular Ring -->
  <polygon
    points="32,10 51,21 51,43 32,54 13,43 13,21"
    stroke="#f8fafc"
    stroke-width="4"
    stroke-linejoin="round"
  />

  <!-- Subtle Orbital Trajectory Ring -->
  <ellipse
    cx="32"
    cy="32"
    rx="21"
    ry="8.5"
    transform="rotate(-28 32 32)"
    stroke="#38bdf8"
    stroke-width="3"
    stroke-opacity="0.85"
    stroke-dasharray="3 3"
  />

  <!-- Precision Nucleus Core -->
  <circle cx="32" cy="32" r="6.5" fill="#10b981" />
  <circle cx="32" cy="32" r="2.5" fill="#ffffff" />

  <!-- Orbital Node Marker -->
  <circle cx="49" cy="23" r="3.2" fill="#ffffff" stroke="#0c0f17" stroke-width="1.5" />
</svg>